<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>議論グラフ（最小形式） — ラグビー部 出店会議</title>
<style>
:root{
  --ground:#dfe3e6; --panel:#f4f5f6; --panel2:#eaedef;
  --ink:#16202b; --ink2:#4a5762; --ink3:#7b8892;
  --rule:#b6bfc6; --rule2:#cfd6da;
  --flag:#a32b1e; --flagBg:#f8e8e5;
  --up:#0f6b62; --down:#a8681c; --policy:#6b3fa0;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);
 font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
 font-size:14px;line-height:1.6;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
header{flex:0 0 auto;display:flex;align-items:baseline;gap:16px;padding:9px 16px;
 background:var(--panel);border-bottom:1px solid var(--rule)}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.04em}
header .sub{font-size:12px;color:var(--ink3)}
header .spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--rule);border-radius:2px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.btn:hover{background:#dfe4e7}
select.f{max-width:190px}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:hidden;cursor:grab;background:var(--ground)}
#stage.drag{cursor:grabbing}
#svg{width:100%;height:100%;display:block;touch-action:none}
aside{flex:0 0 340px;background:var(--panel);border-left:1px solid var(--rule);overflow-y:auto;padding:14px 16px 30px}
footer{flex:0 0 216px;background:var(--panel);border-top:1px solid var(--rule);display:flex;overflow:hidden}
.col{flex:1;min-width:0;border-right:1px solid var(--rule2);display:flex;flex-direction:column}
.col:last-child{border-right:none}
.col h3{margin:0;padding:8px 12px 4px;font-size:12px;font-weight:600;color:var(--ink2);display:flex;gap:7px;align-items:baseline}
.col h3 .n{color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px;line-height:16px;background:var(--ink3)}
.col h3 .n.a{background:var(--flag)} .col h3 .n.b{background:var(--policy)} .col h3 .n.c{background:var(--down)}
.col p{margin:0;padding:0 12px 5px;font-size:11px;color:var(--ink3);line-height:1.45}
.col ul{margin:0;padding:0 12px 12px;list-style:none;overflow-y:auto;flex:1}
.col li{background:#fff;border:1px solid var(--rule2);padding:5px 8px;margin-bottom:4px;font-size:11.5px;line-height:1.45;cursor:pointer}
.col li:hover{border-color:var(--ink)}
.col li b{font-weight:600;letter-spacing:.06em}
.col li .why{color:var(--ink3);display:block;font-size:10.5px;margin-top:1px}
h2{font-size:11.5px;font-weight:600;margin:0 0 7px;color:var(--ink2);letter-spacing:.06em}
.sid{font-size:15px;font-weight:700;letter-spacing:.08em}
.say{font-size:11.5px;color:var(--ink3);margin-left:8px}
.txt{font-size:14px;line-height:1.75;margin:6px 0 14px}
.blk{margin-bottom:13px}
.chip{display:inline-block;border:1px solid var(--rule);background:#fff;border-radius:2px;padding:1px 7px;
 margin:0 4px 4px 0;font-size:11.5px;cursor:pointer;letter-spacing:.05em}
.chip:hover{border-color:var(--ink);background:var(--panel2)}
.chip.src{background:var(--panel2);cursor:default;border-style:dashed}
.grp{background:#fff;border:1px solid var(--rule2);padding:5px 8px;margin-bottom:4px}
.grp .lbl{font-size:10.5px;color:var(--ink3);display:block;margin-bottom:2px}
.reb{background:var(--flagBg);border:1px solid #e0c4be;padding:6px 9px;margin-bottom:4px;font-size:12px;line-height:1.5}
.empty{color:var(--ink3);font-size:12px}
.warn{color:var(--flag);font-size:12px}
#hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:11.5px;color:var(--ink3);pointer-events:none;transition:opacity .35s}
#legend{position:absolute;left:12px;bottom:12px;background:rgba(244,245,246,.94);border:1px solid var(--rule);
 padding:7px 10px;font-size:11px;line-height:1.75;color:var(--ink2);pointer-events:none}
#legend .sw{display:inline-block;width:11px;height:11px;border:1.5px solid;vertical-align:-1px;margin-right:6px}
.node{cursor:pointer}
.node rect.body,.node rect.pill{stroke-width:1.3}
.node text{pointer-events:none}
.nid{font-size:9.5px;font-weight:700;letter-spacing:.1em}
.ntx{font-size:10.5px}
.dim{opacity:.16}
.sel rect{stroke-width:3!important}
.up rect.body{stroke:var(--up);stroke-width:2.4}
.down rect.body{stroke:var(--down);stroke-width:2.4}
.foe rect.body{stroke:var(--flag);stroke-width:2.6}
.edge{fill:none;transition:opacity .2s}
</style>

<header>
  <h1>議論グラフ</h1><span class="sub">ラグビー部 出店会議 / 最小形式</span>
  <span class="spacer"></span>
  <select class="f" id="filter"></select>
  <button class="btn" id="fit">全体表示</button>
  <button class="btn" id="clear">選択解除</button>
</header>

<main>
  <div id="stage">
    <svg id="svg"><g id="cam"><g id="gE"></g><g id="gN"></g></g></svg>
    <div id="hint">ノードをクリックすると右に詳細、緑＝支えの連鎖、橙＝影響先、赤＝反論相手</div>
    <div id="legend">
      <div><span class="sw" style="background:#fff;border-color:#5b6b78"></span>主張</div>
      <div><span class="sw" style="background:#f2e6c8;border-color:#9c7826"></span>出所（経験則・伝聞・直感）</div>
      <div><span class="sw" style="background:#ece7f3;border-color:#6b3fa0"></span>出所（方針）</div>
      <div><span class="sw" style="background:#f8e8e5;border-color:#a32b1e"></span>出所（未調査・未確定）</div>
      <div>○印＝未調査／未確定に依存している主張</div>
    </div>
  </div>
  <aside id="side"></aside>
</main>

<footer id="foot"></footer>

const M=Object.fromEntries(N.map(x=>[x.id,x]));
const SUP={},OUT={},REBin={},REBout={};
N.forEach(x=>{SUP[x.id]=[];OUT[x.id]=[];REBin[x.id]=[];REBout[x.id]=[];});
E.forEach(e=>{
  if(e.kind==="support"){SUP[e.to].push(e.from);e.from.forEach(f=>OUT[f].push(e.to));}
  else{REBout[e.from[0]].push(e);REBin[e.to].push(e);}
});
const secOf=id=>M[id].src?"出所":SEC[id.replace(/\d+$/,"")]||"—";
function down(s){const o=new Set(),st=[...OUT[s]];while(st.length){const x=st.pop();if(o.has(x))continue;o.add(x);OUT[x].forEach(y=>st.push(y));}return o;}
function up(s){const o=new Set(),st=SUP[s].flat().slice();while(st.length){const x=st.pop();if(o.has(x))continue;o.add(x);(SUP[x]||[]).flat().forEach(y=>st.push(y));}return o;}
function collapse(seed){const dead=new Set([seed]);let ch=true;
  while(ch){ch=false;for(const x of N){if(x.src||dead.has(x.id))continue;const gs=SUP[x.id];if(!gs.length)continue;
    if(gs.every(g=>g.some(p=>dead.has(p)))){dead.add(x.id);ch=true;}}}
  dead.delete(seed);return dead;}
const BLOCK={};N.forEach(x=>BLOCK[x.id]=[]);
["未調査","未確定"].forEach(s=>down(s).forEach(x=>BLOCK[x].push(s)));

/* ============================================================
   レイアウト（層別DAG＋重心法）
   ============================================================ */
const NW=170,GAPX=74,GAPY=13,PAD=44;
function wrap(s,u){const L=[];let c="",w=0;
  for(const ch of s){const cw=/[\x00-\xff]/.test(ch)?.55:1;
    if(w+cw>u&&!"、。）」・".includes(ch)){L.push(c);c=ch;w=cw;}else{c+=ch;w+=cw;}}
  if(c)L.push(c);return L.length>3?[...L.slice(0,2),L[2].slice(0,11)+"…"]:L;}
let POS={},W=0,H=0;
function layout(){
  const dep={},seen={};
  const d=id=>{if(dep[id]!=null)return dep[id];if(seen[id])return 0;seen[id]=1;
    const ps=SUP[id].flat().filter(p=>M[p]);return dep[id]=ps.length?1+Math.max(...ps.map(d)):0;};
  N.forEach(x=>d(x.id));
  const box={};N.forEach(x=>{const l=x.src?[x.text]:wrap(x.text,15);
    box[x.id]={l,h:x.src?26:16+l.length*13+6};});
  const cols=[];N.forEach(x=>(cols[dep[x.id]] ||= []).push(x.id));
  cols.forEach(c=>c&&c.sort());
  for(let it=0;it<18;it++){
    const y={};cols.forEach(c=>{if(!c)return;let t=PAD;c.forEach(id=>{y[id]=t+box[id].h/2;t+=box[id].h+GAPY;});});
    for(let k=1;k<cols.length;k++){if(!cols[k])continue;
      cols[k].sort((a,b)=>{const bc=id=>{const p=SUP[id].flat().filter(x=>y[x]!=null);
        return p.length?p.reduce((s,x)=>s+y[x],0)/p.length:y[id];};return bc(a)-bc(b);});}
  }
  POS={};cols.forEach((c,k)=>{if(!c)return;let t=PAD;
    c.forEach(id=>{POS[id]={x:PAD+k*(NW+GAPX),y:t,w:NW,h:box[id].h,l:box[id].l,d:k};t+=box[id].h+GAPY;});});
  W=PAD*2+cols.length*(NW+GAPX)-GAPX;
  H=PAD*2+Math.max(...cols.filter(Boolean).map(c=>c.reduce((s,id)=>s+box[id].h+GAPY,0)));
}

      gE.appendChild(el("circle",{class:"edge",cx:jx,cy:jy,r:2.8,fill:"#9aa4ab","data-e":`j:${e.to}`}));

    const lo=Math.min(a.d,b.d),hi=Math.max(a.d,b.d);let top=Infinity;
    N.forEach(x=>{const p=POS[x.id];if(p&&p.d>=lo&&p.d<=hi)top=Math.min(top,p.y);});
    const arc=top-34-i*12,sx=a.x+a.w,sy=a.y+a.h/2,bx=b.x+b.w*.5;
    gE.appendChild(el("path",{class:"edge",d:`M${sx} ${sy} C${sx+52} ${sy} ${bx} ${arc} ${bx} ${b.y}`,

      if(BLOCK[x.id].length)g.appendChild(el("circle",{cx:p.w-9,cy:p.h-9,r:3.6,fill:"none",stroke:"var(--flag)","stroke-width":1.6}));
    }

function hi(){
  const U=sel?up(sel):null,D=sel?down(sel):null;
  const foes=new Set();if(sel){REBin[sel].forEach(e=>foes.add(e.from[0]));REBout[sel].forEach(e=>foes.add(e.to));}
  const rel=sel?new Set([sel,...U,...D,...foes]):null;
  if(sel)foes.forEach(f=>up(f).forEach(z=>rel.add(z)));
  gN.querySelectorAll(".node").forEach(g=>{const id=g.dataset.id;
    const off=filter&&secOf(id)!==filter&&secOf(id)!=="出所";
    g.classList.toggle("sel",id===sel);
    g.classList.toggle("up",!!U&&U.has(id)&&!foes.has(id));
    g.classList.toggle("down",!!D&&D.has(id)&&!foes.has(id));
    g.classList.toggle("foe",!!sel&&foes.has(id));
    g.classList.toggle("dim",sel?!rel.has(id):off);});
  gE.querySelectorAll(".edge").forEach(p=>{
    const d=p.dataset.e||"";let live=true;
    if(sel){
      if(d[0]==="j")live=rel.has(d.slice(2));
      else{const[a,b]=d.slice(2).split(">");live=rel.has(a)&&rel.has(b);}
    }else if(filter){
      const ids=d[0]==="j"?[d.slice(2)]:d.slice(2).split(">");
      live=ids.some(i=>secOf(i)===filter);
    }
    p.classList.toggle("dim",!live);});
  document.getElementById("hint").style.opacity=sel?0:1;
}
function fit(){const r=svg.getBoundingClientRect();
  const k=Math.min(r.width/(W+30),r.height/(H+60),1.1);
  view={k,x:(r.width-W*k)/2,y:(r.height-H*k)/2+22*k};
  cam.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`);}
function focus(id){const p=POS[id];if(!p)return;const r=svg.getBoundingClientRect();
  view.k=Math.max(view.k,.75);
  view.x=r.width/2-(p.x+p.w/2)*view.k;view.y=r.height/2-(p.y+p.h/2)*view.k;
  cam.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`);}
{
  const st=document.getElementById("stage");let dr=null;
  st.addEventListener("pointerdown",e=>{if(e.target.closest(".node"))return;
    dr={x:e.clientX-view.x,y:e.clientY-view.y};st.classList.add("drag");st.setPointerCapture(e.pointerId);});
  st.addEventListener("pointermove",e=>{if(!dr)return;view.x=e.clientX-dr.x;view.y=e.clientY-dr.y;
    cam.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`);});
  st.addEventListener("pointerup",()=>{dr=null;st.classList.remove("drag");});
  st.addEventListener("wheel",e=>{e.preventDefault();const r=svg.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;
    const k=Math.min(2.6,Math.max(.18,view.k*(e.deltaY<0?1.13:1/1.13)));
    view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k;
    cam.setAttribute("transform",`translate(${view.x} ${view.y}) scale(${view.k})`);},{passive:false});
  gN.addEventListener("click",e=>{const g=e.target.closest(".node");if(!g)return;
    pick(g.dataset.id===sel?null:g.dataset.id);});
}
function pick(id,move){sel=id;hi();side();if(id&&move)focus(id);}

/* ============================================================
   右パネル
   ============================================================ */
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chip=id=>`<span class="chip ${M[id].src?"src":""}" data-go="${id}">${M[id].src?"《"+id+"》":id}</span>`;
function side(){
  const a=document.getElementById("side");
  if(!sel){a.innerHTML=`<h2>詳細</h2><p class="empty">ノードをクリックすると、その主張の全文・支え・影響範囲が出ます。<br><br>下の欄は、いま何が確定していないかと、そのせいで止まっている判断の一覧です。</p>`;return;}
  const x=M[sel];
  if(x.src){a.innerHTML=`<h2>出所ノード</h2><div class="sid">《${x.id}》</div>
    <div class="txt">${SRC[x.id]}</div>
    <div class="blk"><h2>これに支えられた主張（直接）</h2>${OUT[x.id].map(chip).join("")||'<span class="empty">なし</span>'}</div>
    <div class="blk"><h2>間接を含めた影響範囲</h2><b>${down(x.id).size}</b> 件</div>`;
    bindGo(a);return;}
  const D=down(sel),U=up(sel),C=collapse(sel);
  a.innerHTML=`<h2>${secOf(sel)}</h2>
    <div><span class="sid">${sel}</span><span class="say">発言 #${x.say}</span></div>
    <div class="txt">${esc(x.text)}</div>
    <div class="blk"><h2>支え</h2>${
      SUP[sel].length?SUP[sel].map(g=>`<div class="grp"><span class="lbl">${g.length>1?"この"+g.length+"つが揃って支える":"支え"}</span>${g.map(chip).join("")}</div>`).join(""):
      '<span class="warn">支えなし</span>'}</div>
    ${BLOCK[sel].length?`<div class="blk"><h2>確定していない依存</h2><div class="reb">${BLOCK[sel].map(b=>"《"+b+"》").join(" ")} に依存しているため、この主張はまだ確定できません。</div></div>`:""}
    ${REBin[sel].length?`<div class="blk"><h2>受けている反論</h2>${REBin[sel].map(e=>`<div class="reb">${chip(e.from[0])}<br>${esc(e.note)}</div>`).join("")}</div>`:""}
    ${REBout[sel].length?`<div class="blk"><h2>出している反論</h2>${REBout[sel].map(e=>`<div class="reb">→ ${chip(e.to)}<br>${esc(e.note)}</div>`).join("")}</div>`:""}
    <div class="blk"><h2>これを支えているもの（直接）</h2>${SUP[sel].flat().map(chip).join("")||'<span class="empty">なし</span>'}</div>
    <div class="blk"><h2>これが支えているもの（直接）</h2>${OUT[sel].map(chip).join("")||'<span class="empty">なし — この主張はどこにも使われていません</span>'}</div>
    <div class="blk"><h2>影響範囲</h2>
      書き換えると <b>${D.size}</b> 件が要再検討、うち <b style="color:var(--flag)">${C.size}</b> 件は支えを失って倒れます。
      <div style="margin-top:6px">${[...D].map(i=>`<span class="chip" data-go="${i}" ${C.has(i)?'style="border-color:var(--flag);color:var(--flag)"':""}>${i}</span>`).join("")}</div></div>`;
  bindGo(a);
}
function bindGo(root){root.querySelectorAll("[data-go]").forEach(e=>e.onclick=()=>pick(e.dataset.go,true));}

/* ============================================================
   下パネル：NextAction
   ============================================================ */
function foot(){
  const f=document.getElementById("foot");
  const kids=s=>OUT[s].filter(x=>!M[x].src);
  const investigate=kids("未調査").map(id=>({id,extra:down(id).size}));
  const waiting=kids("未確定").map(id=>({id,extra:down(id).size}));
  const hunch=N.filter(x=>!x.src&&SUP[x.id].length&&SUP[x.id].every(g=>g.every(p=>p==="直感"))&&!REBin[x.id].length);
  const unused=N.filter(x=>!x.src&&!OUT[x.id].length&&!REBout[x.id].length&&!REBin[x.id].length
    &&SUP[x.id].length&&SUP[x.id].every(g=>g.every(p=>M[p].src&&p!=="直感")));
  const col=(cls,title,desc,items)=>`<div class="col"><h3>${title}<span class="n ${cls}">${items.length}</span></h3>
    <p>${desc}</p><ul>${items.length?items.map(i=>
      `<li data-go="${i.id}"><b>${i.id}</b> ${esc(M[i.id].text.slice(0,52))}${M[i.id].text.length>52?"…":""}
       ${i.note?`<span class="why">${i.note}</span>`:""}</li>`).join(""):'<li style="cursor:default;color:var(--ink3)">該当なし</li>'}</ul></div>`;
  f.innerHTML=
   col("a","調べる（未調査）","調べれば分かるのに、まだ確かめていない。ここが止まると下流も止まる。",
     investigate.map(o=>({id:o.id,note:`確定するまで ${o.extra} 件の判断が確定しない`})))+
   col("b","待つ・備える（未確定）","まだ起きていないので分からない。両方の枝に備える必要がある。",
     waiting.map(o=>({id:o.id,note:`この結果に ${o.extra} 件がぶら下がっている`})))+
   col("c","根拠が直感だけ","反論もされず、支えが《直感》しかないまま生き残っている主張。",
     hunch.map(x=>({id:x.id,note:"支えを足すか、意識的に直感として採用する"})))+
   col("","使われていない資料","出したきり、どの判断にもつながっていない。見落としの可能性がある。",
     unused.map(x=>({id:x.id,note:"この事実を使うべき判断がないか確認する"})));
  bindGo(f);
}

/* ============================================================ */
{
  const sel2=document.getElementById("filter");
  sel2.innerHTML=`<option value="">すべての区画を表示</option>`+
    [...new Set(N.filter(x=>!x.src).map(x=>secOf(x.id)))].map(s=>`<option value="${s}">${s}</option>`).join("");
  sel2.onchange=()=>{filter=sel2.value;hi();};
}
document.getElementById("fit").onclick=fit;
document.getElementById("clear").onclick=()=>pick(null);
addEventListener("resize",()=>{if(!sel)fit();});
render();fit();side();foot();
</script>
